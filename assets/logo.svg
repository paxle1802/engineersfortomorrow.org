<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" role="img" aria-label="Engineers For Tomorrow Outreach">
  <title>Engineers For Tomorrow Outreach</title>
  <defs>
    <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0f2849"/>
      <stop offset="1"   stop-color="#1a3a64"/>
    </linearGradient>
  </defs>

  <!-- MARK: refined geometric monogram (hex + filament + arrow) -->
  <g transform="translate(38 45)">
    <polygon points="-28,0 -14,-24 14,-24 28,0 14,24 -14,24"
             fill="none" stroke="url(#markStroke)" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#b87333">
      <rect x="-11" y="-12" width="3.5" height="24" rx="0.8"/>
      <rect x="-11" y="-12" width="15"  height="3.5" rx="0.8"/>
      <rect x="-11" y="-1.8" width="12"  height="3.5" rx="0.8"/>
      <rect x="-11" y="8.5"  width="15"  height="3.5" rx="0.8"/>
    </g>
    <path d="M 10 -7 L 19 0 L 10 7 Z" fill="#0f2849"/>
  </g>

  <!-- WORDMARK -->
  <g font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif">
    <text x="82" y="36"
          font-weight="800" font-size="22"
          letter-spacing="-0.4"
          fill="#0f2849">ENGINEERS</text>
    <text x="82" y="58"
          font-weight="600" font-size="14"
          letter-spacing="3.4"
          fill="#0f2849">FOR&#160;TOMORROW</text>
    <text x="82" y="75"
          font-weight="600" font-size="9"
          letter-spacing="3.8"
          fill="#b87333">OUTREACH&#160;&#183;&#160;U.S.&#160;VIRGIN&#160;ISLANDS</text>
  </g>
</svg>
