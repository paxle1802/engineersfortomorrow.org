<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" role="img" aria-label="Engineers For Tomorrow Outreach">
  <title>Engineers For Tomorrow Outreach</title>
  <defs>
    <!-- gradient for "Tomorrow" word -->
    <linearGradient id="tomGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0d6e7a"/>
      <stop offset="1"   stop-color="#0a5158"/>
    </linearGradient>
  </defs>

  <!-- ============================================================
       Decorative sparks / mascot characters (left + right of word)
       Casual organic style matching EOT's playful brand
       ============================================================ -->
  <!-- LEFT spark figure: stylized person reaching up with bulb -->
  <g transform="translate(30 38)">
    <!-- body -->
    <ellipse cx="0" cy="14" rx="4.5" ry="6" fill="#0d6e7a"/>
    <!-- head -->
    <circle cx="0" cy="4" r="3.5" fill="#0d6e7a"/>
    <!-- arms up -->
    <path d="M -3 12 Q -6 4 -4 -2" stroke="#0d6e7a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M  3 12 Q  6 4  4 -2" stroke="#0d6e7a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="-2" y1="19" x2="-3.5" y2="26" stroke="#0d6e7a" stroke-width="2" stroke-linecap="round"/>
    <line x1="2"  y1="19" x2="3.5"  y2="26" stroke="#0d6e7a" stroke-width="2" stroke-linecap="round"/>
    <!-- spark/lightbulb above hands -->
    <circle cx="0" cy="-6" r="4" fill="#fbb13c"/>
    <g stroke="#fbb13c" stroke-width="1.5" stroke-linecap="round">
      <line x1="0"  y1="-13" x2="0"  y2="-15"/>
      <line x1="-5" y1="-9"  x2="-7" y2="-10"/>
      <line x1="5"  y1="-9"  x2="7"  y2="-10"/>
      <line x1="-4" y1="-3"  x2="-6" y2="-2"/>
      <line x1="4"  y1="-3"  x2="6"  y2="-2"/>
    </g>
  </g>

  <!-- RIGHT spark figure: stylized person with gear/circuit -->
  <g transform="translate(330 38)">
    <ellipse cx="0" cy="14" rx="4.5" ry="6" fill="#e8533e"/>
    <circle cx="0" cy="4" r="3.5" fill="#e8533e"/>
    <path d="M -3 12 Q -6 4 -5 -2" stroke="#e8533e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M  3 12 Q  6 4  5 -2" stroke="#e8533e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="-2" y1="19" x2="-3.5" y2="26" stroke="#e8533e" stroke-width="2" stroke-linecap="round"/>
    <line x1="2"  y1="19" x2="3.5"  y2="26" stroke="#e8533e" stroke-width="2" stroke-linecap="round"/>
    <!-- gear above -->
    <g transform="translate(0 -6)">
      <circle r="3.5" fill="none" stroke="#fbb13c" stroke-width="1.5"/>
      <circle r="1.2" fill="#fbb13c"/>
      <g fill="#fbb13c">
        <rect x="-0.8" y="-6"   width="1.6" height="2" rx="0.3"/>
        <rect x="-0.8" y="4"    width="1.6" height="2" rx="0.3"/>
        <rect x="-6"   y="-0.8" width="2"   height="1.6" rx="0.3"/>
        <rect x="4"    y="-0.8" width="2"   height="1.6" rx="0.3"/>
      </g>
    </g>
  </g>

  <!-- ============================================================
       WORDMARK — script "engineers for" + display "TOMORROW"
       ============================================================ -->
  <!-- "engineers for" — italic friendly script -->
  <text x="180" y="40"
        font-family="'Caveat', 'Comic Sans MS', cursive"
        font-style="italic"
        font-weight="700"
        font-size="28"
        text-anchor="middle"
        fill="#e8533e">engineers for</text>

  <!-- "Tomorrow" — large bold display -->
  <text x="180" y="78"
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-weight="800"
        font-size="38"
        text-anchor="middle"
        letter-spacing="-1"
        fill="url(#tomGrad)">Tomorrow</text>

  <!-- tagline -->
  <text x="180" y="98"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="600"
        font-size="9"
        text-anchor="middle"
        letter-spacing="3.5"
        fill="#0d6e7a">OUTREACH &#183; U.S. VIRGIN ISLANDS</text>
</svg>
